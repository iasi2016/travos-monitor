name: Test & Monitor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      base_date:
        description: 'Data de plecare (format ZZ/LL/AAAA)'
        required: false
        default: '20/09/2026'
      days_before:
        description: 'Zile inainte de data de plecare'
        required: false
        default: '1'
      days_after:
        description: 'Zile dupa data de plecare'
        required: false
        default: '1'
      max_price:
        description: 'Pret maxim in EUR (lasati 0 sau gol pentru nelimitat)'
        required: false
        default: '0'

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: pytest tests/ -v
    
    - name: Run monitor
      env:
        BASE_DATE: ${{ github.event.inputs.base_date || '20/09/2026' }}
        DAYS_BEFORE: ${{ github.event.inputs.days_before || '1' }}
        DAYS_AFTER: ${{ github.event.inputs.days_after || '1' }}
        MAX_PRICE: ${{ github.event.inputs.max_price || '0' }}
      run: python main.py

    - name: Upload Database Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: travos-prices-db
        path: prices.db

